# Temporal PPE compliance pipeline (SH17 YOLOv8s + ByteTrack).
# All numbers are starting hypotheses, not calibrated ground truth.
# Run: python scripts/run_ppe_pipeline.py --clips VIDEO.mp4 --config configs/ppe_pipeline.yaml

model:
  path: models/sh17/yolo8s.pt
  # torch | onnx (ONNX Runtime CPU, same weights exported from path). ONNX was made the default after
  # parity checks matched every box (IoU 1.0, identical confidences) on 400 frames.
  backend: onnx
  onnx_path: models/sh17/yolo8s_960.onnx
  onnx_imgsz: [544, 960]       # = PyTorch's letterboxed input at imgsz 960 for 1920x1080 video
  # null = library default, which was fastest for ONNX (115 ms vs 117/125/135 ms at 8/6/4 threads) and
  # within noise for torch (~135 ms at 4-8 threads) in the local benchmark.
  cpu_threads: null
  imgsz: 960
  conf: 0.10
  iou: 0.45                    # same NMS IoU as the earlier SH17 evaluation
  classes: [0, 10, 16]         # verified at startup against model.names
  class_names: {0: person, 10: helmet, 16: safety-vest}
  device: cpu
  # --person-model PATH optionally replaces the person branch. It is not the
  # default: it improved reviewed BF/bagging frames but missed an occluded conveyor worker.

runtime:
  target_fps: 5.0                  # null processes every source frame; preserve source timestamps

detection_quality:
  person_class: 0
  classes:
    # Keep the low confidence pool for ByteTrack recovery. Size/aspect checks
    # reject text-sized and malformed boxes, not stationary people.
    0: {min_conf: 0.10, min_width_px: 8, min_height_px: 32, min_aspect: 0.45, max_aspect: 7.0, max_area_fraction: 0.85}

tracking:
  tracker: bytetrack.yaml      # Ultralytics ByteTrack defaults
  # Chosen by replaying cached detections on the original four clips.
  # fuse_score multiplies IoU by confidence, which broke tracks of low-confidence workers.
  # match_thresh 0.85/0.9 let a walking worker's track jump onto a seated worker (workshop, 8.2 s); 0.8 does not.
  overrides: {fuse_score: false, match_thresh: 0.8}
  track_buffer_seconds: 2.5    # converted to update calls using the sampled FPS
  min_confirmed_observations: 3
  confirmation_window_seconds: 0.6
  min_confirm_median_conf: 0.25      # median person conf over the confirmation window
  min_confirm_height_px: 40          # median person box height over the confirmation window
  confirmation_border_margin_px: 3  # partial edge boxes may recover tracks but cannot create a new worker
  # Re-attach a new track to a lost confirmed worker only if exactly one candidate qualifies.
  # Both stitches in the replay (workshop 1.8 s, ladle bay 1.9 s) were checked visually to be the same person.
  stitch_max_gap_seconds: 3.0        # 0 disables stitching
  stitch_min_iou: 0.3
  stitch_max_size_ratio: 1.3
  appearance_stitch_guard: true
  stitch_min_appearance_similarity: 0.65
  # Jump guard: current box must overlap old OR motion-predicted box by jump_min_iou;
  # after a longer loss a low overlap AND a height change above jump_max_size_ratio end the identity.
  jump_min_iou: 0.3
  jump_window_seconds: 0.5
  jump_max_size_ratio: 1.5
  # Untracked person detections overlapping a tracked one (or each other) above this IoU are duplicates;
  # the rest compete for PPE boxes and count as occluders in the observability gate.
  duplicate_person_iou: 0.6

association:
  helmet_min_conf: 0.25
  vest_min_conf: 0.30
  helmet_min_width_fraction: 0.08
  helmet_min_height_fraction: 0.025
  vest_min_width_fraction: 0.15
  vest_min_height_fraction: 0.08
  head_region_fraction: 0.32
  torso_start_fraction: 0.20
  torso_end_fraction: 0.75
  min_ppe_overlap_fraction: 0.60
  ambiguity_margin: 0.15
  helmet_max_width_fraction: 0.80    # of person width
  helmet_max_height_fraction: 0.35   # of person height
  vest_max_width_fraction: 1.10
  vest_max_height_fraction: 0.75
  near_miss_overlap_fraction: 0.20   # a PPE box this close to a region blocks negative evidence

observability:
  min_person_conf: 0.35
  min_person_height_px: 90
  min_head_region_px: 24             # shorter side of the head region
  min_torso_region_px: 40            # shorter side of the torso region
  min_aspect_ratio: 0.9              # person height / width; lower is treated as partial
  border_margin_px: 3                # person box this close to the frame edge is partial
  max_other_person_overlap: 0.20     # fraction of the region covered by other workers
  min_laplacian_var: 15.0            # below this the region is too blurred
  min_mean_intensity: 40
  max_mean_intensity: 220
  dark_pixel_level: 20
  max_dark_fraction: 0.50
  bright_pixel_level: 250
  max_bright_fraction: 0.30

ppe:
  min_positive_conf: 0.10
  positive_confirmation_count: 2
  positive_window_seconds: 0.8
  positive_hold_seconds: 1.0
  suspected_absence_seconds: 2.5
  min_eligible_negative_observations: 10
  min_eligible_fraction: 0.60        # of genuine observations in the absence window
  stale_negative_seconds: 1.0        # suspected state reverts to UNKNOWN when no eligible view for this long

alerts:
  cooldown_seconds: 30
  allow_unvalidated_camera_absence_alerts: false

zones:
  min_full_body_aspect: 1.6         # short/wide or tiny boxes do not establish a floor contact
  min_floor_box_height_px: 80
  entry_seconds: 0.6
  exit_seconds: 0.6
  boundary_margin_px: 5
  unknown_hold_seconds: 1.0
  border_margin_px: 3

# Absence-based alerts are only allowed on cameras with a validated flag.
# None of these cameras has been validated with frame-level ground truth.
cameras:
  - id: tippler_wt1_load_side
    match: "clip_Tippler_1&2_WT-1_Load_Side"
    scene: tippler
    zones: ../zones/tippler.json
    # Reviewed fixed electrical panel at x~895-944,y~165-266 (1920x1080).
    # Exclude floor anchors on this panel only; re-review after camera movement.
    person_exclusion_polygons: [[[0.462, 0.15], [0.495, 0.15], [0.495, 0.255], [0.462, 0.255]]]
    helmet_absence_validated: false
    vest_absence_validated: false
  - id: crm_work_shop
    match: "clip_CRM_Work_Shop"
    scene: workshop
    zones: ../zones/workshop.json
    helmet_absence_validated: false
    vest_absence_validated: false
  - id: crm_conv2
    match: "clip_CRM_1&2_CONV#2"
    scene: conveyor
    zones: ../zones/conveyor.json
    feet_occlusion_polygons: [[[0.40, 0.84], [0.76, 0.78], [0.80, 1.0], [0.40, 1.0]]]
    helmet_absence_validated: false
    vest_absence_validated: false
  - id: red_lrs1_ladle_bay
    match: "clip_RED_LRS-1"
    scene: ladle_bay
    zones: ../zones/ladle_bay.json
    helmet_absence_validated: false    # detector found helmets in 8/375 frames; all 4 labeled workers wear one
    vest_absence_validated: false

output:
  dir: out
  evidence_seconds: 3.0
  video_codec: mp4v
  queue_frames: 8                    # bounded decode / write queues (background threads)
  snapshot_fractions: [0.25, 0.5, 0.75]
