# Pipeline settings. The helmet classifier's threshold ships with its weights (ppe.classifier); fixed
# constants are named and explained in the code. Times are in seconds, so the rules keep their meaning
# when the processing fps changes.

detector:
  weights: weights/sh17/yolo8s.pt   # SH17: person, head, helmet, safety-vest (+13 unused classes)
  # at 640 it finds 8 of the 33 helmets and 29 of the 183 heads it finds at 1280 (eval/pixel_budget.py)
  imgsz: 1280
  device: mps          # mps | cpu | cuda:0 (for the .pt)
  # macOS only, used when present (scripts/export_models.py --detector): fp16, 736x1280 input, same
  # detections as the .pt (scripts/bench_detector.py). null = always use the .pt
  coreml: weights/sh17/yolo8s_736x1280.mlpackage
  # detector ms per frame (scripts/bench_detector.py): Neural Engine 22, cpu_only 71 (run.py --cpu-only);
  # the .pt on MPS 53, on CPU 187
  coreml_units: cpu_and_ne  # cpu_and_ne | cpu_only
  conf: 0.10           # low floor so ByteTrack's second stage can use weak person boxes
  classes: {person: 0, helmet: 10, head: 12, vest: 16}
  min_conf: {head: 0.30, helmet: 0.25, vest: 0.30}

sampling:
  process_fps: 10      # frames per second actually sent to the detector; the rest are only decoded

tracker:               # ultralytics BYTETracker, persons only
  track_high_thresh: 0.25
  track_low_thresh: 0.10
  new_track_thresh: 0.30
  match_thresh: 0.8
  fuse_score: true
  track_buffer_s: 3.0  # keep a lost track this long (people walking behind machines)

ppe:
  helmet_method: classifier  # classifier | detector (SH17 helmet-over-head rule, the baseline)
  classifier:
    # threshold: read from the .json next to the weights (set on two steel-plant calibration cameras)
    weights: weights/helmet_cls/mnv3s_64_sb2.pt
    # heads shorter than this read "can't tell". 10 -> 18 on the 43 sample clips from cameras outside
    # the held-out set: false-alarm clips 1/25 -> 0/25, violation clips caught stay 2/2
    min_head_px: 18
    # no head or helmet box -> "can't tell" (50 clips: caught 1/5 -> 3/5, false-alarm clips 3/25 -> 1/25)
    require_head_det: true
  head_region: 0.40    # a head must sit in the top 40% of its person box
  edge_margin_px: 3    # box this close to the left/right edge: helmet and vest "can't tell"; top edge: helmet
  # detector method only:
  helmet_expand: 0.6   # grow the head box upward by this x head height before checking helmet overlap
  helmet_overlap: 0.30 # >= this fraction of a helmet box inside the grown head box = helmet worn
  min_head_px: 14      # heads shorter than this read "can't tell"
  vest:
    enabled: true
    # shorter people: vest "can't tell" (50 clips: 120 -> 100 px raised person recall .47 -> .60 at the
    # same precision)
    min_person_px: 100
    torso: [0.15, 0.75]  # vest centre must fall in this vertical band of the person box

zones:
  # a track must reach this person confidence once before it can alert on a zone; its earlier frames
  # still count (dev clips: no zone entry lost for values up to 0.8)
  confirm_conf: 0.5
  hysteresis: 0.10     # ground point must be 0.10 x person height inside to enter, outside to leave
  hidden_feet_ratio: 0.75  # box shorter than 75% of the track's tallest recent height = feet hidden
  height_decay_per_s: 0.817  # decay per second of that tallest-height memory (0.98 per frame at 10 fps)

view:                  # has the camera moved since its zones were drawn? (cameras with zones only)
  check_every_s: 1.0   # match the frame to the zone file's reference view this often (~10 ms, off the frame loop)
  width: 640           # both views are matched at this width
  features: 1000       # ORB keypoints per view (500 lost matches between days)
  min_inliers: 20      # fewer matches agreeing on one transform = view unrecognisable = moved
  max_shift: 0.02      # a zone corner moving more than 2% of the frame width (38 px at 1080p) = moved
  persist_s: 3.0       # moved (or back) for this long before it counts: a passing truck isn't a move

events:
  default:
    window_s: 2.0      # sliding vote window
    threshold: 0.7     # share of readable frames in the window that must be violating
    min_observed_s: 0.6  # readable frames needed in the window, in seconds of frames (6 at 10 fps, 3 at 5)
    min_duration_s: 1.5  # violation must have persisted this long before alerting
    end_after_s: 3.0   # violation unseen this long = episode over
    cooldown_s: 60     # same person + type won't re-alert within this long of the episode ending
    merge_window_s: 5.0  # a new track appearing within this long of a lost one...
    merge_radius: 1.0    # ...and within 1 person-height of it, inherits its event (ID switch)
    nested_overlap: 0.8  # a new box >= 80% inside the box feeding an open event = same person
  zone_entry:
    window_s: 1.0
    threshold: 0.6
    min_observed_s: 0.4
    min_duration_s: 0.5

output:
  clip_pre_s: 3.0      # alert clip: from 3 s before the violation started...
  clip_post_s: 3.0     # ...to 3 s after the alert fired
  clip_width: 960
  buffer_extra_s: 5.0  # extra history kept so a late-confirmed alert still gets its pre-roll
  video_width: 1280    # --save-video / --show
  hidden_s: 1.0        # draw a lost-but-remembered track (dashed, predicted box) this long after its last detection
